server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  client_max_body_size 6m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    add_header Cache-Control no-store always;
  }
  location = /health {
    proxy_pass http://backend:8080/actuator/health;
    access_log off;
  }
  # 设备台账路由与 Vite 的 assets 目录同名，直接返回 SPA。
  location = /assets { try_files /index.html =404; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
